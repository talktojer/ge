version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: ge-postgres-dev
    environment:
      POSTGRES_DB: galactic_empire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for hot state and pubsub
  redis:
    image: redis:7
    container_name: ge-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI application
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    container_name: ge-api-dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:dev@postgres:5432/galactic_empire
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # ge-sim simulation engine
  ge-sim:
    build:
      context: ./server
      dockerfile: Dockerfile.ge-sim
    container_name: ge-sim-dev
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:dev@postgres:5432/galactic_empire
      REDIS_URL: redis://redis:6379/0
      SHIP_TICK_INTERVAL: 6.0
      PLANET_TICK_INTERVAL: 55.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: python -m ge_sim.sim_engine

volumes:
  postgres_data:
